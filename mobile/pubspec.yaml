publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.2
  sensors_plus: ^6.1.1
  vibration: ^3.1.3
