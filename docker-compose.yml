services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: crosssafe
      POSTGRES_PASSWORD: crosssafe
      POSTGRES_DB: crosssafe
    ports:
      - "5432:5432"
    volumes:
      - crosssafe_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosssafe -d crosssafe"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://crosssafe:crosssafe@db:5432/crosssafe
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  crosssafe_pg:
