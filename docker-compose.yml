services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: crosssafe
      POSTGRES_PASSWORD: crosssafe
      POSTGRES_DB: crosssafe
    ports:
      - "5432:5432"
    volumes:
      - crosssafe_pg:/var/lib/postgresql/data
      - ./backend/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://crosssafe:crosssafe@db:5432/crosssafe
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  crosssafe_pg:
